services:

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tts-net

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - tts-net

  # one-shot service that pulls the model then exits
  model-puller:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "${GEMMA_MODEL:-gemma3:4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - tts-net
    restart: "no"

volumes:
  ollama_models:

networks:
  tts-net:
    driver: bridge
