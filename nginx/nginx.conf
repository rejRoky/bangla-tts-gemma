# WebSocket upgrade map — must be in http context, before server block
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

upstream api {
    server   api:8000;
    keepalive 32;
}

upstream frontend {
    server   frontend:8501;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── SSE endpoint — buffering must be off ──────────────────────────────
    location /api/tts/stream {
        proxy_pass         http://api/tts/stream;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── FastAPI — /api/* (strip prefix) ───────────────────────────────────
    location /api/ {
        proxy_pass         http://api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── FastAPI health at top-level ────────────────────────────────────────
    location = /health {
        proxy_pass         http://api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Streamlit — everything else (including WebSocket) ─────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
